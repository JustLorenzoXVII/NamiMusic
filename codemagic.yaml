# Codemagic: compila l'app iPhone di ArchiveTuneX su un Mac nel cloud e la manda su TestFlight.
# Si avvia a mano dal sito di Codemagic ("Start new build").
workflows:
  ios-testflight:
    name: ArchiveTuneX iPhone → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 90

    # Cache tra una build e l'altra: librerie di Gradle e compilatore Kotlin per iPhone (~/.konan).
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
        - $HOME/.konan

    # La chiave API di App Store Connect già registrata su Codemagic con il nome "Rota"
    # (Codemagic non permette di registrare due volte la stessa chiave con nomi diversi).
    integrations:
      app_store_connect: Rota

    environment:
      # Firma dell'app: Codemagic installa sul Mac il certificato e il profilo caricati
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.justlorenzo.archivetunex
      vars:
        APP_STORE_APPLE_ID: 6823529618
      java: 21
      xcode: latest

    scripts:
      - name: Prepara Gradle
        script: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          # Android Studio fissa la versione di Java per Gradle (gradle/gradle-daemon-jvm.properties):
          # sul Mac di Codemagic proverebbe a scaricarla da internet. Si usa il Java 21 già installato.
          rm -f gradle/gradle-daemon-jvm.properties
          # Memoria per Gradle: il ~/.gradle/gradle.properties del Mac di Codemagic vince su quello del progetto.
          mkdir -p ~/.gradle
          touch ~/.gradle/gradle.properties
          sed -i '' '/^org.gradle.jvmargs/d' ~/.gradle/gradle.properties
          echo "org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties

      - name: Leggi team e profilo di firma
        script: |
          APP_PROFILE=""
          for PROFILE in "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision; do
            security cms -D -i "$PROFILE" > /tmp/profile.plist
            APP_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" /tmp/profile.plist)
            UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /tmp/profile.plist)
            echo "Profilo $UUID per $APP_ID"
            case "$APP_ID" in
              *.com.justlorenzo.archivetunex)
                APP_PROFILE=$UUID
                TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" /tmp/profile.plist) ;;
            esac
          done
          if [ -z "$APP_PROFILE" ]; then echo "Manca il profilo di com.justlorenzo.archivetunex su Codemagic."; exit 1; fi
          echo "TEAM_ID=$TEAM_ID" >> $CM_ENV
          echo "APP_PROFILE=$APP_PROFILE" >> $CM_ENV

      - name: Scrivi la firma nel progetto
        script: |
          P=iosApp/iosApp.xcodeproj/project.pbxproj
          sed -i '' \
            -e 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/' \
            -e 's/CODE_SIGN_IDENTITY = "Apple Development";/CODE_SIGN_IDENTITY = "Apple Distribution";/' \
            -e 's/DEVELOPMENT_TEAM = "${TEAM_ID}";/DEVELOPMENT_TEAM = '"$TEAM_ID"';/' \
            "$P"
          grep -n "CODE_SIGN\|PROVISIONING\|DEVELOPMENT_TEAM" "$P"

      - name: Numero di build
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          NEXT=$((LATEST + 1))
          echo "Numero di build: $NEXT"
          echo "APP_BUILD_NUMBER=$NEXT" >> $CM_ENV

      - name: Compila e archivia l'app iPhone
        script: |
          set -o pipefail
          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/ArchiveTuneX.xcarchive \
            CURRENT_PROJECT_VERSION="$APP_BUILD_NUMBER" \
            ARCHIVETUNEX_APP_PROFILE="$APP_PROFILE" \
            | tee /tmp/xcodebuild_archive.log | xcpretty

      - name: Crea il file .ipa
        script: |
          cat > /tmp/export_options.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.justlorenzo.archivetunex</key><string>$APP_PROFILE</string>
            </dict>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/ArchiveTuneX.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist /tmp/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_archive.log

    publishing:
      app_store_connect:
        auth: integration
        # false: le build arrivano solo ai tester interni (niente revisione beta di Apple)
        submit_to_testflight: false
