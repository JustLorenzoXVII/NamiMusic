# Compila l'app iPhone completa (Swift compreso) su un Mac di GitHub, senza mandarla su TestFlight.
name: Controllo app iPhone (Xcode)

on:
  # Solo a mano (Actions → "Controllo app iPhone (Xcode)" → Run workflow): i minuti dei Mac
  # servono alle build TestFlight, che compilano comunque anche lo Swift.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xcode-check-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # App iPhone completa (Swift compreso) su un Mac: così gli errori di SwiftUI si vedono prima di Codemagic
  xcode:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      # Il compilatore Kotlin per iPhone (~/.konan) resta tra una build e l'altra: meno minuti di Mac
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Prepara Gradle e Xcode 26
        run: |
          chmod +x gradlew
          rm -f gradle/gradle-daemon-jvm.properties
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" > ~/.gradle/gradle.properties
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1); fi
          echo "Uso $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Compila l'app iPhone (simulatore, senza firma)
        id: xcode
        continue-on-error: true
        run: |
          set +e
          set -o pipefail
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES build 2>&1 | tee xcode-full.log
          STATUS=$?
          grep -nE "error:|warning: .*GlassChrome|BUILD (SUCCEEDED|FAILED)" xcode-full.log > xcode.log
          exit $STATUS

      - name: Salva i log nel branch ci-logs
        if: always()
        run: |
          SHA=$(git rev-parse --short HEAD)
          mkdir -p /tmp/logs
          cp xcode.log /tmp/logs/ 2>/dev/null || true
          tail -300 xcode-full.log > /tmp/logs/xcode-tail.log 2>/dev/null || true
          { echo "commit: $SHA"; echo "xcode: ${{ steps.xcode.outcome }}"; } > /tmp/logs/summary.txt
          git config user.name "build-check"
          git config user.email "build-check@users.noreply.github.com"
          git checkout --orphan ci-logs-new
          git rm -rf --cached . > /dev/null
          git clean -fdx -e /tmp > /dev/null || true
          cp /tmp/logs/* .
          git add summary.txt *.log
          git commit -m "Log Xcode $SHA"
          git push --force origin ci-logs-new:"ci-logs-${{ github.ref_name }}-xcode"
      - name: Esito
        if: steps.xcode.outcome != 'success'
        run: exit 1
