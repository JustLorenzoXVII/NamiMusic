# Compila l'app iPhone su un Mac di GitHub e la manda su TestFlight (al posto di Codemagic).
# Si avvia a mano: GitHub → Actions → "iPhone → TestFlight" → Run workflow → scegli il branch.
#
# Servono 4 "secrets" del repository (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID       ID della chiave API di App Store Connect (es. 2X9R4HXF34)
#   ASC_ISSUER_ID    Issuer ID (in cima alla pagina delle chiavi, formato xxxxxxxx-xxxx-…)
#   ASC_PRIVATE_KEY  contenuto del file AuthKey_XXXX.p8 (tutto, righe BEGIN/END comprese)
#   APPLE_TEAM_ID    Team ID dell'account sviluppatore (10 caratteri, es. A1B2C3D4E5)
#
# La firma è automatica: con la chiave (ruolo Admin) Xcode crea da solo certificato e profilo
# di distribuzione, firma l'app e la carica su App Store Connect per i tester interni.
name: iPhone → TestFlight

on:
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      # Il compilatore Kotlin per iPhone (~/.konan) resta tra una build e l'altra: meno minuti di Mac
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Prepara Gradle e Xcode 26
        run: |
          chmod +x gradlew
          rm -f gradle/gradle-daemon-jvm.properties
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" > ~/.gradle/gradle.properties
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1); fi
          echo "Uso $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Chiave di App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then echo "Manca il secret $v (vedi le istruzioni in cima al file)"; exit 1; fi
          done
          mkdir -p ~/private_keys
          printf '%s\n' "$ASC_PRIVATE_KEY" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          echo "KEY_PATH=$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" >> $GITHUB_ENV
          # Numero di build sempre crescente: anno-mese-giorno-ora-minuto (es. 2610201930)
          echo "BUILD_NUMBER=$(date -u +%y%m%d%H%M)" >> $GITHUB_ENV

      # KOTLIN_FRAMEWORK_BUILD_TYPE=Debug: la parte Kotlin si collega in modalità debug anche
      # nell'archivio (in release l'ottimizzazione finisce la memoria del Mac). Swift resta in Release.
      # L'archivio si crea senza firma: la firma la mette l'esportazione qui sotto.
      - name: Compila e archivia l'app iPhone
        run: |
          set -o pipefail
          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Nami.xcarchive \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            TEAM_ID="${{ secrets.APPLE_TEAM_ID }}" \
            KOTLIN_FRAMEWORK_BUILD_TYPE=Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee archive.log | grep -E "error:|warning: .*GlassChrome|ARCHIVE (SUCCEEDED|FAILED)|\*\* " || true
          test -d build/Nami.xcarchive || { tail -80 archive.log; exit 1; }

      - name: Firma e carica su TestFlight
        run: |
          cat > export_options.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>testFlightInternalTestingOnly</key><true/>
            <key>uploadSymbols</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/Nami.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist export_options.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            2>&1 | tee export.log
          # Le righe importanti diventano note della build (leggibili anche senza aprire il log)
          grep -iE "error|warning|upload|export|provision|certificate|ITMS" export.log | tail -15 | while IFS= read -r line; do
            echo "::notice title=Esportazione::${line:0:900}"
          done
          grep -q "EXPORT SUCCEEDED\|Upload succeeded\|Uploaded" export.log || { echo "::error::Esportazione o caricamento non riusciti"; exit 1; }
          echo "::notice title=TestFlight::Build $BUILD_NUMBER inviata a TestFlight"

      - name: Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-log
          path: |
            archive.log
            export.log
          if-no-files-found: ignore
