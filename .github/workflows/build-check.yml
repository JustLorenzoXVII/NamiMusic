# Compila il progetto su GitHub a ogni push, così gli errori si vedono subito
# senza dover compilare a mano. I log finiscono nel branch "ci-logs" (master)
# o "ci-logs-<ramo>" (altri rami).
name: Controllo compilazione

on:
  push:
    branches: [master, interfaccia, nuova-ui, liquid-glass]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-check-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Prepara Gradle
        run: |
          chmod +x gradlew
          rm -f gradle/gradle-daemon-jvm.properties
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" > ~/.gradle/gradle.properties
          echo "kotlin.native.enableKlibsCrossCompilation=true" >> ~/.gradle/gradle.properties

      - name: Compila Android
        id: android
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :androidApp:assembleDebug --console=plain --continue --no-configuration-cache 2>&1 | tee android.log

      - name: Compila e collega il framework iOS (senza Xcode)
        id: ios
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :shared:compileKotlinIosArm64 :shared:linkDebugFrameworkIosArm64 --console=plain --continue --no-configuration-cache 2>&1 | tee ios.log

      - name: Firme delle API di quickjs-kt (diagnostica)
        if: always()
        continue-on-error: true
        run: |
          KLIB_TOOL=$(ls -d ~/.konan/kotlin-native-prebuilt-*/bin/klib | head -1)
          for f in $(find ~/.gradle/caches/modules-2 -path "*quickjs-kt-iosarm64*" -name "*.klib" ! -name "*Cinterop*"); do
            echo "== $f"
            "$KLIB_TOOL" dump-metadata "$f" 2>&1 | grep -nE "evaluate|fun .*function|asyncFunction|package " | head -80
          done > quickjs-api.log 2>&1 || true

      - name: Salva i log nel branch ci-logs
        if: always()
        run: |
          SHA=$(git rev-parse --short HEAD)
          mkdir -p /tmp/logs
          cp android.log ios.log quickjs-api.log /tmp/logs/ 2>/dev/null || true
          {
            echo "commit: $SHA"
            echo "android: ${{ steps.android.outcome }}"
            echo "ios: ${{ steps.ios.outcome }}"
          } > /tmp/logs/summary.txt
          git config user.name "build-check"
          git config user.email "build-check@users.noreply.github.com"
          git checkout --orphan ci-logs-new
          git rm -rf --cached . > /dev/null
          git clean -fdx -e /tmp > /dev/null || true
          cp /tmp/logs/* .
          git add summary.txt *.log
          git commit -m "Log compilazione $SHA"
          if [ "${{ github.ref_name }}" = "master" ]; then TARGET=ci-logs; else TARGET="ci-logs-${{ github.ref_name }}"; fi
          git push --force origin ci-logs-new:$TARGET
      - name: Esito
        if: steps.android.outcome != 'success' || steps.ios.outcome != 'success'
        run: exit 1

  # App iPhone completa (Swift compreso) su un Mac: così gli errori di SwiftUI si vedono prima di Codemagic
  xcode:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Prepara Gradle e Xcode 26
        run: |
          chmod +x gradlew
          rm -f gradle/gradle-daemon-jvm.properties
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" > ~/.gradle/gradle.properties
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1); fi
          echo "Uso $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Compila l'app iPhone (simulatore, senza firma)
        id: xcode
        continue-on-error: true
        run: |
          set +e
          set -o pipefail
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES build 2>&1 | tee xcode-full.log
          STATUS=$?
          grep -nE "error:|warning: .*GlassChrome|BUILD (SUCCEEDED|FAILED)" xcode-full.log > xcode.log
          exit $STATUS

      - name: Salva i log nel branch ci-logs
        if: always()
        run: |
          SHA=$(git rev-parse --short HEAD)
          mkdir -p /tmp/logs
          cp xcode.log /tmp/logs/ 2>/dev/null || true
          tail -300 xcode-full.log > /tmp/logs/xcode-tail.log 2>/dev/null || true
          { echo "commit: $SHA"; echo "xcode: ${{ steps.xcode.outcome }}"; } > /tmp/logs/summary.txt
          git config user.name "build-check"
          git config user.email "build-check@users.noreply.github.com"
          git checkout --orphan ci-logs-new
          git rm -rf --cached . > /dev/null
          git clean -fdx -e /tmp > /dev/null || true
          cp /tmp/logs/* .
          git add summary.txt *.log
          git commit -m "Log Xcode $SHA"
          git push --force origin ci-logs-new:"ci-logs-${{ github.ref_name }}-xcode"
      - name: Esito
        if: steps.xcode.outcome != 'success'
        run: exit 1
